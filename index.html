<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Templates Directory</title>
<meta name="description" content="Eleven fully designed website templates across food, medical, IT, fashion, fintech, real estate, travel, architecture, automotive and Web3. Filter by domain or theme and preview each one live.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--surface:#fff;--ink:#16181d;--muted:#6a6f7a;--line:#e4e2dc;--brand:#2b3bff;--brand-ink:#fff;--shadow:0 1px 2px rgba(20,20,30,.05),0 8px 24px rgba(20,20,30,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1015;--surface:#171a21;--ink:#eef0f4;--muted:#9aa1ae;--line:#262a33;--brand:#7c8bff;--brand-ink:#0e1015;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header.top{padding:56px 0 28px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
h1{font-size:clamp(30px,5vw,48px);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:10px 0 12px}
.lede{color:var(--muted);max-width:640px;font-size:16px}
.controls{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;position:relative}
.search input{width:100%;font:inherit;font-size:14px;padding:11px 14px 11px 40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
select{font:inherit;font-size:14px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.chips .lab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.chip{font:inherit;font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.filters{padding-top:6px}
.chips.collapsed{max-height:78px;overflow:hidden}
.meta{display:flex;justify-content:space-between;align-items:center;margin:22px 0 14px;font-size:14px;color:var(--muted)}
.link{background:none;border:0;font:inherit;font-size:14px;color:var(--brand);cursor:pointer;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding-bottom:72px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);text-align:left;padding:0;font:inherit;color:inherit;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px);outline:2px solid var(--brand);outline-offset:2px}
.thumb{aspect-ratio:16/10;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:18px}
.thumb .n{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.thumb .bar{height:6px;width:56px;border-radius:99px}
.thumb .dots{display:flex;gap:6px}.thumb .dots i{width:10px;height:10px;border-radius:50%;opacity:.9}
.badge3d{position:absolute;top:14px;right:14px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);color:inherit;border:1px solid currentColor}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.dom{font-size:12px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.08em}
.body p{font-size:14px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:11.5px;padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:13px}
/* viewer */
.viewer{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
.viewer.open{display:flex}
.vbar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.vtitle{font-weight:600;font-size:15px;margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtitle small{font-weight:400;color:var(--muted);margin-left:8px}
.btn{font:inherit;font-size:13px;font-weight:500;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:8px 12px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.stage{flex:1;display:flex;justify-content:center;background:color-mix(in srgb,var(--ink) 8%,var(--bg));overflow:auto;min-height:0}
.frame{width:100%;height:100%;border:0;background:#fff;transition:width .25s;box-shadow:var(--shadow)}
.frame.tablet{width:820px;max-width:100%}.frame.mobile{width:390px;max-width:100%}
@media (max-width:640px){.seg.dev{display:none}.vbar .hide-s{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="eyebrow">Template Directory</div>
  <h1>Eleven websites, one place to browse them.</h1>
  <p class="lede">Pick a domain or a theme, then open any card to explore the full site without leaving this page.</p>
</div></header>

<section class="controls"><div class="wrap">
  <div class="row">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search by name, domain or style" aria-label="Search templates"></label>
    <select id="mode" aria-label="Filter by mode"><option value="">Light and dark</option><option>Light</option><option>Dark</option></select>
    <select id="three" aria-label="Filter by 3D"><option value="">With or without 3D</option><option value="1">3D scene included</option><option value="0">No 3D</option></select>
    <select id="sort" aria-label="Sort"><option value="num">Original order</option><option value="az">Name A to Z</option></select>
  </div>
</div></section>
<section class="wrap filters">
  <div class="chips" id="domains" role="group" aria-label="Domain"><span class="lab">Domain</span></div>
  <div class="chips collapsed" id="themes" role="group" aria-label="Theme"><span class="lab">Theme</span></div>
  <button class="link" id="moreThemes" type="button" style="margin-top:8px">Show all themes</button>
</section>

<main class="wrap">
  <div class="meta"><span id="count"></span><button class="link" id="reset" hidden>Clear filters</button></div>
  <div class="grid" id="grid"></div>
</main>

<footer><div class="wrap">All brands, people and details in these templates are fictional. Built with plain HTML, CSS and JavaScript.</div></footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Template preview">
  <div class="vbar">
    <button class="btn" id="vclose">&larr; Back</button>
    <div class="vtitle" id="vtitle"></div>
    <select id="vpage" aria-label="Page" class="hide-s"></select>
    <div class="seg dev" role="group" aria-label="Device width">
      <button data-d="desktop" aria-pressed="true">Desktop</button><button data-d="tablet" aria-pressed="false">Tablet</button><button data-d="mobile" aria-pressed="false">Mobile</button>
    </div>
    <button class="btn hide-s" id="vprev" aria-label="Previous template">&lsaquo; Prev</button>
    <button class="btn hide-s" id="vnext" aria-label="Next template">Next &rsaquo;</button>
    <a class="btn primary" id="vopen" target="_blank" rel="noopener">Open in new tab</a>
  </div>
  <div class="stage"><iframe class="frame" id="frame" title="Template preview" loading="lazy"></iframe></div>
</div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var data=[],state={q:"",domain:"",themes:[],mode:"",three:"",sort:"num"};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};

fetch("templates.json").then(function(r){return r.json()}).then(function(d){
  data=d.map(function(t,i){t.n=i;return t});
  buildChips();readHash();render();openFromUrl();
});

function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i})}
function buildChips(){
  var doms=uniq(data.map(function(t){return t.domain}));
  var themes=uniq([].concat.apply([],data.map(function(t){return t.tags}))).sort();
  var D=$("#domains");
  [""].concat(doms).forEach(function(d){D.appendChild(chip(d||"All",function(b){state.domain=(state.domain===d||!d)?"":d;sync()},"d:"+d))});
  var T=$("#themes");
  themes.forEach(function(t){T.appendChild(chip(t,function(){var i=state.themes.indexOf(t);i<0?state.themes.push(t):state.themes.splice(i,1);sync()},"t:"+t))});
}
function chip(label,fn,key){var b=document.createElement("button");b.className="chip";b.textContent=label;b.dataset.key=key;b.setAttribute("aria-pressed","false");b.onclick=fn;return b}
function sync(){render();writeHash()}

function match(t){
  var q=state.q.toLowerCase();
  if(q&&(t.name+" "+t.domain+" "+t.tagline+" "+t.tags.join(" ")).toLowerCase().indexOf(q)<0)return false;
  if(state.domain&&t.domain!==state.domain)return false;
  if(state.mode&&t.mode!==state.mode)return false;
  if(state.three!==""&&(t.three?"1":"0")!==state.three)return false;
  return state.themes.every(function(x){return t.tags.indexOf(x)>-1});
}
function render(){
  var list=data.filter(match);
  if(state.sort==="az")list.sort(function(a,b){return a.name.localeCompare(b.name)});
  var g=$("#grid");g.innerHTML="";
  list.forEach(function(t){g.appendChild(card(t))});
  if(!list.length)g.innerHTML='<div class="empty">No templates match these filters. Try clearing one.</div>';
  $("#count").textContent=list.length+" of "+data.length+" templates";
  var active=state.q||state.domain||state.mode||state.three!==""||state.themes.length;
  $("#reset").hidden=!active;
  document.querySelectorAll(".chip").forEach(function(c){
    var k=c.dataset.key,on=k==="d:"?!state.domain:k.indexOf("d:")===0?state.domain===k.slice(2):state.themes.indexOf(k.slice(2))>-1;
    c.setAttribute("aria-pressed",on)});
  $("#q").value=state.q;$("#mode").value=state.mode;$("#three").value=state.three;$("#sort").value=state.sort;
}
function card(t){
  var b=document.createElement("button");b.className="card";b.type="button";
  b.setAttribute("aria-label","Open "+t.name);
  b.innerHTML='<div class="thumb" style="background:'+t.colors.bg+';color:'+t.colors.ink+'">'+
    (t.three?'<span class="badge3d">3D</span>':'')+
    '<div class="dots"><i style="background:'+t.colors.accent+'"></i><i style="background:'+t.colors.ink+';opacity:.5"></i></div>'+
    '<div><div class="bar" style="background:'+t.colors.accent+'"></div><div class="n" style="margin-top:12px">'+esc(t.name)+'</div></div></div>'+
    '<div class="body"><div class="dom">'+esc(t.domain)+'</div><p>'+esc(t.tagline)+'</p>'+
    '<div class="tags"><span class="tag">'+t.mode+'</span>'+t.tags.map(function(x){return'<span class="tag">'+esc(x)+'</span>'}).join("")+'</div></div>';
  b.onclick=function(){openViewer(t.id)};
  return b;
}

$("#moreThemes").onclick=function(){var c=$("#themes").classList.toggle("collapsed");this.textContent=c?"Show all themes":"Show fewer themes"};
/* filters wiring */
$("#q").oninput=function(e){state.q=e.target.value;sync()};
$("#mode").onchange=function(e){state.mode=e.target.value;sync()};
$("#three").onchange=function(e){state.three=e.target.value;sync()};
$("#sort").onchange=function(e){state.sort=e.target.value;sync()};
$("#reset").onclick=function(){state={q:"",domain:"",themes:[],mode:"",three:"",sort:state.sort};sync()};

/* hash state, so filtered views can be shared */
function writeHash(){
  var p=new URLSearchParams();
  if(state.q)p.set("q",state.q);if(state.domain)p.set("domain",state.domain);
  if(state.themes.length)p.set("themes",state.themes.join(","));
  if(state.mode)p.set("mode",state.mode);if(state.three!=="")p.set("three",state.three);
  var s=p.toString();history.replaceState(null,"",location.pathname+location.search.replace(/[?&]site=[^&]*/,"")+(s?"#"+s:""));
}
function readHash(){
  var p=new URLSearchParams(location.hash.slice(1));
  state.q=p.get("q")||"";state.domain=p.get("domain")||"";state.mode=p.get("mode")||"";
  state.three=p.has("three")?p.get("three"):"";state.themes=p.get("themes")?p.get("themes").split(","):[];
}

/* viewer */
var cur=null,lastFocus=null;
function byId(id){return data.filter(function(t){return t.id===id})[0]}
function openViewer(id,page){
  var t=byId(id);if(!t)return;cur=t;lastFocus=document.activeElement;
  var v=$("#viewer");v.classList.add("open");document.body.style.overflow="hidden";
  $("#vtitle").innerHTML=esc(t.name)+'<small>'+esc(t.domain)+'</small>';
  var sel=$("#vpage");sel.innerHTML=t.pages.map(function(p){return'<option value="'+p[1]+'">'+esc(p[0])+'</option>'}).join("");
  load(page||t.pages[0][1]);
  var u=new URL(location.href);u.searchParams.set("site",id);history.replaceState(null,"",u.pathname+u.search+u.hash);
  $("#vclose").focus();
}
function load(file){
  $("#vpage").value=file;
  var url=cur.folder+"/"+file;
  $("#frame").src=url;$("#vopen").href=url;
}
function closeViewer(){
  $("#viewer").classList.remove("open");document.body.style.overflow="";$("#frame").src="about:blank";
  var u=new URL(location.href);u.searchParams.delete("site");history.replaceState(null,"",u.pathname+u.search+u.hash);
  if(lastFocus)lastFocus.focus();
}
function step(d){var list=data.filter(match);var i=list.indexOf(cur);if(i<0)list=data,i=data.indexOf(cur);var n=list[(i+d+list.length)%list.length];openViewer(n.id)}
function openFromUrl(){var id=new URLSearchParams(location.search).get("site");if(id)openViewer(id)}
$("#vclose").onclick=closeViewer;
$("#vprev").onclick=function(){step(-1)};$("#vnext").onclick=function(){step(1)};
$("#vpage").onchange=function(e){load(e.target.value)};
document.querySelectorAll(".seg.dev button").forEach(function(b){b.onclick=function(){
  document.querySelectorAll(".seg.dev button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});
  $("#frame").className="frame "+b.dataset.d}});
document.addEventListener("keydown",function(e){
  if(!$("#viewer").classList.contains("open"))return;
  if(e.key==="Escape")closeViewer();
  else if(e.key==="ArrowRight"&&e.target.tagName!=="SELECT")step(1);
  else if(e.key==="ArrowLeft"&&e.target.tagName!=="SELECT")step(-1);
});
})();
</script>
</body>
</html>
